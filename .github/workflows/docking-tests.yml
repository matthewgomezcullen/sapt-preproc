# Runs the SAPT preprocessing test suite. The environment is the same conda specification the work
# is developed against, so a failure here means the code moved, not the toolchain.
name: docking tests

on:
  push:
    paths:
      - "research/docking/**"
      - ".github/workflows/docking-tests.yml"
  pull_request:
    paths:
      - "research/docking/**"
      - ".github/workflows/docking-tests.yml"
  workflow_dispatch:

concurrency:
  group: docking-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # micromamba activates the environment through the login shell.
    shell: bash -el {0}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite runs in about two minutes on a developer machine. Solving the environment on a cold
    # cache is the slower half.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create the sapt-preproc environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: research/docking/src/environment.yml
          # Keyed on the environment file, so this only re-solves when the dependencies change.
          cache-environment: true

      - name: Check the fixtures are present
        working-directory: research/docking/src
        run: |
          if [ ! -d data/posebusters ] || [ ! -d data/diffdock ]; then
            echo "::error::research/docking/src/data is not in the repository, so every test that "\
                 "loads a complex will fail to collect. See research/docking/README.md."
            exit 1
          fi

      - name: Run the test suite
        working-directory: research/docking/src
        run: pytest tests
