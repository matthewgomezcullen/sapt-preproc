# Builds on macOS as well as on the cluster.
# Dice and PySCF's interface to it are not here, as Dice is an MPI C++ program with no conda 
# package that only builds on Linux. `setup.sh` builds it on the cluster and installs it into the 
# environment's bin.
name: sapt-preproc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - scipy=1.17.1
  - pyscf=2.14.0
  - openmm=8.6.0
  - pdbfixer=1.12
  - gemmi=0.7.4
  - rdkit=2026.03.5
  - pytest=8.4.2
  - qiskit=2.5.2
  - pip
  - jupyter
  - ipykernel
  # qiskit-nature owns the mapping from the active-space integrals onto qubits. It has no
  # conda-forge package, and pins qiskit>=1.4,<3.0, which the pin above satisfies.
  - pip:
      - qiskit-nature==0.8.0
