# Builds on macOS as well as on the cluster.
# Dice and PySCF's interface to it are not here, as Dice is an MPI C++ program with no conda 
# package that only builds on Linux. `setup.sh` builds it on the cluster and installs it into the 
# environment's bin.
name: sapt-preproc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.0.5
  - pyscf=2.14.0
  - openmm=8.6.0
  - pdbfixer=1.12
  - openmmforcefields=0.16.0
  - openff-toolkit=0.18.0
  - gemmi=0.7.4
  - rdkit=2026.03.1
  - posebusters=0.6.5
  - tqdm=4.70.0
  - pytest=8.4.2
  - qiskit=2.5.2
  - pip
  - jupyter
  - ipykernel
  - pip:
      - qiskit-nature==0.8.0
